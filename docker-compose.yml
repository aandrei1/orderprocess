services:
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: op-php
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      DATABASE_URL: postgresql://order:order@postgres:5432/order?serverVersion=16&charset=utf8
    volumes:
      # Named volume shared with filebeat. It is a more specific mount than the
      # anonymous /app/var/ in compose.override.yaml, so it wins for var/log
      # while the rest of var/ (cache) stays container-local.
      - app_logs:/app/var/log
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: op-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  postgres:
    image: postgres:16-alpine
    container_name: op-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: order
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d order"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Log stack (DEV ONLY: no authentication, no TLS) ---
  # Needs vm.max_map_count >= 262144 on the Docker host (see README).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4
    container_name: op-elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      # DEV ONLY: security disabled so Kibana/Filebeat/curl need no credentials.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.4
    container_name: op-kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.19.4
    container_name: op-filebeat
    # Started only by `make logs-up`, after the index template exists (a
    # document indexed before the template would get a dynamic mapping).
    profiles: ["logs"]
    # root so it can read the logs written by root in op-php (DEV ONLY).
    user: root
    # The config is bind-mounted from the host and may look world-writable
    # (WSL/NTFS); strict.perms would make Filebeat refuse it.
    command: ["filebeat", "-e", "-c", "/usr/share/filebeat/config/filebeat.yml", "--strict.perms=false"]
    volumes:
      # Directory, not the single file: a file bind mount goes stale when an
      # editor replaces the file (new inode) on the WSL/Docker Desktop mount.
      - ./docker/filebeat:/usr/share/filebeat/config:ro
      - app_logs:/logs:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  rabbitmq_data:
  postgres_data:
  app_logs:
  elasticsearch_data:
  filebeat_data:
