; /app is bind-mounted from the Windows host through Docker Desktop's WSL2
; backend, where stat()/readdir() are unusually slow (measured: listing
; vendor/'s ~8800 files took ~13s through the mount vs ~0.5s on a native
; Linux path). OPcache's default freshness check does a stat() on every
; included file on every request, and Symfony's dev-mode container/config
; cache does the same for every tracked resource — together this is why
; localhost:8000 and the test suite feel slow while CPU/RAM sit idle.
;
; Trade-off: PHP stops noticing source changes on its own. Run
; `make cc` (cache:clear) — or restart the php container — after editing
; code, config, or Doctrine mapping XML, to pick the change up.
opcache.validate_timestamps=0

; Off by default: every CLI invocation (bin/console, PHPUnit) recompiles the
; whole framework from scratch instead of reusing the shared memory cache,
; which is the dominant cost for `composer test:*` and `bin/console` here.
opcache.enable_cli=1

; Sized for this repo's file count (default 4096K/120s starts evicting and
; re-resolving paths well before that many entries settle).
realpath_cache_size=16M
realpath_cache_ttl=600
