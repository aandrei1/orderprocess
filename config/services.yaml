# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Orders\:
        resource: '../src/Orders/'
        exclude:
            - '../src/Orders/Domain/'
            - '../src/Orders/Infrastructure/Persistence/'

    # Domain services (explicit registration)
    App\Orders\Domain\:
        resource: '../src/Orders/Domain/'

    # Infrastructure services (explicit registration)
    App\Orders\Infrastructure\Persistence\DoctrineOrderRepository:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'

    App\Orders\Infrastructure\Persistence\DoctrineProductRepository:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'

    App\Orders\Infrastructure\Persistence\DoctrineTransactionManager:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'

    # Read side: raw DBAL, no ORM — see DoctrineOrderReadModel.
    App\Orders\Infrastructure\Persistence\DoctrineOrderReadModel:
        arguments:
            $connection: '@doctrine.dbal.default_connection'

    App\Orders\Infrastructure\Persistence\DoctrineProductReadModel:
        arguments:
            $connection: '@doctrine.dbal.default_connection'

    App\Orders\Domain\Port\OrderRepository: '@App\Orders\Infrastructure\Persistence\DoctrineOrderRepository'
    App\Orders\Domain\Port\ProductRepository: '@App\Orders\Infrastructure\Persistence\DoctrineProductRepository'
    App\Orders\Domain\Port\PaymentGateway: '@App\Orders\Infrastructure\Messaging\MockPaymentGateway'
    App\Orders\Application\Port\DomainEventDispatcher: '@App\Orders\Infrastructure\Messaging\OutboxDomainEventDispatcher'
    App\Orders\Application\Port\TransactionManager: '@App\Orders\Infrastructure\Persistence\DoctrineTransactionManager'
    App\Orders\Application\Port\OrderReadModel: '@App\Orders\Infrastructure\Persistence\DoctrineOrderReadModel'
    App\Orders\Application\Port\ProductReadModel: '@App\Orders\Infrastructure\Persistence\DoctrineProductReadModel'

    # Bus aliases
    Symfony\Component\Messenger\MessageBusInterface $commandBus: '@command.bus'
    Symfony\Component\Messenger\MessageBusInterface $queryBus: '@query.bus'
    Symfony\Component\Messenger\MessageBusInterface $eventBus: '@event.bus'
