framework:
    messenger:
        default_bus: command.bus
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    auto_setup: true
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 10000
            failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: failed
            sync: 'sync://'

        routing:
            'App\Orders\Application\Command\*': async
            'App\Orders\Application\Query\*': sync

        buses:
            # No doctrine_transaction: the transaction boundary is declared
            # explicitly in the handler, via the TransactionManager port. A
            # single place defines it, visible in the code and independent of
            # bus configuration — otherwise atomicity would depend on the path
            # the command takes to reach the handler (bus vs. direct call from
            # UI/Command).
            command.bus: ~
            query.bus:
                middleware:
                    - doctrine_transaction
            event.bus:
                default_middleware: allow_no_handlers

